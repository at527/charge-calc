<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Model Y LR Charge Cost Calc</title>
    <style>
        * {
            font-family: 'Source Code Pro', monospace;
        }
    </style>
</head>

<body>

    <div>
        <span>$</span><span id="charge_cost"> 0.00</span>
    </div>

    <div>
        <label for="cost_per_kwh">$</label>
        <input type="number" inputmode="decimal" id="cost_per_kwh" name="cost_per_kwh" min="0" max="100" value="0.00"
            step="0.01" />
        <span>/kwh</span>
    </div>

    <div>
        <span>Start charge </span><span id="start_charge_val">0</span><label for="start_charge">%</label>
        <input type="range" name="start_charge" id="start_charge" min="0" max="100" step="5">
    </div>

    <div>
        <span>End charge </span><span id="end_charge_val">0</span><label for="end_charge">%</label>
        <input type="range" name="end_charge" id="end_charge" min="0" max="100" step="5">
    </div>


    <script>
        // Battery capacity in kWh
        const battery_capacity = 75;

        // Cache DOM elements for easier access
        const costPerKwhInput = document.getElementById('cost_per_kwh');
        const startChargeInput = document.getElementById('start_charge');
        const endChargeInput = document.getElementById('end_charge');
        const startChargeVal = document.getElementById('start_charge_val');
        const endChargeVal = document.getElementById('end_charge_val');
        const chargeCostDisplay = document.getElementById('charge_cost');

        // Function to calculate and update charge cost
        function updateChargeCost() {
            const cost_per_kwh = parseFloat(costPerKwhInput.value) || 0;
            const start_charge = parseFloat(startChargeInput.value) || 0;
            const end_charge = parseFloat(endChargeInput.value) || 0;

            // Calculate energy used (in kWh) and total charge cost
            const energy_used_kwh = (end_charge - start_charge) / 100 * battery_capacity;
            const charge_cost = (energy_used_kwh * cost_per_kwh).toFixed(2);

            // Update the displayed charge cost
            chargeCostDisplay.textContent = charge_cost;
        }

        // Function to update slider labels
        function updateSliderLabels() {
            startChargeVal.textContent = startChargeInput.value;
            endChargeVal.textContent = endChargeInput.value;
        }

        // Function to handle input changes, save to localStorage and update charge cost
        function handleInputChange(event) {
            const input = event.target;
            localStorage.setItem(input.id, input.value);

            // Update relevant information depending on which input was changed
            if (input.id === 'start_charge' || input.id === 'end_charge') {
                updateSliderLabels();
            }
            updateChargeCost();
        }

        // Attach event listeners to all inputs
        [costPerKwhInput, startChargeInput, endChargeInput].forEach(input => {
            input.addEventListener('input', handleInputChange);
        });

        // On page load, retrieve and apply saved values from localStorage
        window.onload = function () {
            ['cost_per_kwh', 'start_charge', 'end_charge'].forEach(inputId => {
                const savedValue = localStorage.getItem(inputId);
                if (savedValue !== null) {
                    document.getElementById(inputId).value = savedValue;
                }
            });

            // Update the slider labels and charge cost based on the loaded values
            updateSliderLabels();
            updateChargeCost();
        };

    </script>
</body>

</html>
